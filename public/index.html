<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>ديوان الورق</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Katibeh&family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231a1a1a'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='%23fff' font-family='serif'%3Eد%3C/text%3E%3C/svg%3E" />
</head>
<body>

<div id="app">

  <!-- ===================== NAV (pre-game only) ===================== -->
  <nav class="nav" id="nav">
    <button class="nav-btn" id="nav-back" hidden>رجوع</button>
    <div class="nav-brand" id="nav-brand">ديوان الورق</div>
    <div class="nav-right">
      <span class="nav-step" id="nav-step"></span>
      <button class="nav-btn nav-mute" id="nav-mute" title="الصوت">♪</button>
    </div>
  </nav>

  <!-- ===================== HOME ===================== -->
  <section class="screen active" id="screen-home">
    <div class="hero">
      <div class="calli" id="calli-home"></div>
      <div class="hero-text">
        <h1 class="brand">ديوان الورق</h1>
        <p class="brand-sub">ليخة · تريكس · ٤٠٠</p>
        <button class="btn btn-solid btn-lg" id="btn-enter">ادخل</button>
      </div>
    </div>
  </section>

  <!-- ===================== CHOOSE GAME ===================== -->
  <section class="screen" id="screen-choose">
    <div class="panel">
      <h2 class="h2">اختر اللعبة</h2>
      <div class="games">
        <button class="tile" data-game="leekha"><span class="tile-name">ليخة</span><span class="tile-sub">هديّة، ليخة، و١٠١ نقطة</span></button>
        <button class="tile soon" data-game="trix"><span class="tile-name">تريكس</span><span class="tile-sub">قريباً</span></button>
        <button class="tile soon" data-game="trixComplex"><span class="tile-name">تريكس كومبلكس</span><span class="tile-sub">قريباً</span></button>
        <button class="tile soon" data-game="four00"><span class="tile-name">٤٠٠</span><span class="tile-sub">قريباً</span></button>
      </div>
    </div>
  </section>

  <!-- ===================== NAME + CODE ===================== -->
  <section class="screen" id="screen-party">
    <div class="panel panel-narrow">
      <h2 class="h2" id="party-game">ليخة</h2>
      <label class="field">
        <span>اسمك</span>
        <input id="inp-name" maxlength="18" placeholder="أبو خليل" autocomplete="nickname" />
      </label>
      <label class="field">
        <span>رمز الديوان <em>(اتركه فارغاً لإنشاء ديوان جديد)</em></span>
        <input id="inp-code" class="code-input" maxlength="6" placeholder="— — — — — —" autocapitalize="characters" spellcheck="false" />
      </label>
      <button class="btn btn-solid btn-lg btn-block" id="btn-go">ادخل</button>
      <button class="btn-text" id="btn-bots" hidden>العب وحدك مع ثلاثة بوتات</button>
    </div>
  </section>

  <!-- ===================== LOBBY ===================== -->
  <section class="screen" id="screen-lobby">
    <div class="panel">
      <p class="eyebrow" id="lobby-game">ليخة</p>
      <div class="code-block">
        <span class="code-label">رمز الديوان</span>
        <span class="code-value" id="lobby-code">——————</span>
        <button class="btn btn-line btn-sm" id="btn-share">شارك الدعوة</button>
      </div>
      <div class="seats" id="lobby-seats"></div>
      <p class="status" id="lobby-status">بانتظار الرفاق…</p>
      <div class="actions">
        <button class="btn btn-solid btn-lg" id="btn-start" hidden disabled>ابدأ</button>
        <button class="btn btn-line" id="btn-fill" hidden>أكمل المقاعد بالبوتات</button>
      </div>
    </div>
  </section>

  <!-- ===================== TABLE ===================== -->
  <section class="screen" id="screen-table">
    <header class="hud">
      <div class="hud-info">
        <span class="hud-game" id="hud-game">ليخة</span>
        <span class="hud-round" id="hud-round">الجولة ١</span>
        <button class="nav-btn nav-mute" id="hud-mute" title="الصوت">♪</button>
      </div>
      <div class="hud-msg" id="hud-msg"></div>
      <div class="totals" id="totals"></div>
    </header>

    <div class="table" id="table">
      <div class="felt" id="felt"></div>

      <div class="seat-spot pos-2" data-pos="2"></div>
      <div class="seat-spot pos-3" data-pos="3"></div>
      <div class="seat-spot pos-1" data-pos="1"></div>
      <div class="seat-spot pos-0" data-pos="0"></div>

      <div class="trick" id="trick">
        <div class="trick-slot pos-0"></div>
        <div class="trick-slot pos-1"></div>
        <div class="trick-slot pos-2"></div>
        <div class="trick-slot pos-3"></div>
        <div class="trick-banner" id="trick-banner"></div>
      </div>

      <div class="drop-hint" id="drop-hint">أفلت الورقة هنا</div>

      <div class="giftbox" id="giftbox" hidden>
        <div class="gift-head">
          <span class="gift-title">الهديّة</span>
          <span class="gift-sub" id="gift-sub"></span>
        </div>
        <div class="gift-slots" id="gift-slots">
          <div class="gift-slot" data-i="0"></div>
          <div class="gift-slot" data-i="1"></div>
          <div class="gift-slot" data-i="2"></div>
        </div>
        <button class="btn btn-solid" id="btn-gift" disabled>أرسل</button>
        <p class="gift-wait" id="gift-wait" hidden>أُرسلت — بانتظار الآخرين</p>
      </div>
    </div>

    <div class="hand-wrap" id="hand-wrap">
      <div class="hand" id="hand"></div>
    </div>
  </section>

  <!-- ===================== OVERLAYS ===================== -->
  <div class="overlay" id="overlay-scores" hidden>
    <div class="panel panel-narrow">
      <h2 class="h2" id="scores-title">النقاط</h2>
      <p class="verdict" id="scores-verdict" hidden></p>
      <div class="teams" id="teams"></div>
      <table class="scores" id="scores-table"></table>
      <div class="actions">
        <button class="btn btn-solid btn-lg" id="btn-next-round" hidden>جولة جديدة</button>
        <button class="btn btn-line" id="btn-close-scores">إغلاق</button>
      </div>
      <p class="status" id="scores-wait" hidden></p>
    </div>
  </div>

  <div id="fly"></div>
  <div id="toasts"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
